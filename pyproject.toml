[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubase-chord-voicing-mcp"
version = "0.1.0"
description = "Cubase 트랙용 코드 진행 / 보이싱 / 리듬을 자동 생성하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "cubase", "midi", "music", "chords", "voicing", "rhythm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["mido>=1.3"]

[project.scripts]
cubase-mcp = "cubase_mcp.server:main"
cubase-studio = "cubase_mcp.studio:main"
cubase-mcp-setup = "cubase_mcp.setup_wizard:main"

[tool.setuptools.packages.find]
include = ["cubase_mcp*"]

[tool.setuptools.package-data]
cubase_mcp = ["py.typed", "*.html"]
